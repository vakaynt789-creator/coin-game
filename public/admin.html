<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель кодов — FG_coиn$</title>
<style>
  :root{--bg:#0f1420;--panel:#1a2130;--panel2:#232c3d;--line:#2e3a4e;--text:#eef2f8;--muted:#93a1b5;--accent:#5b8cff;--accent2:#34d399;--red:#f87171;--gold:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  .panel h2{font-size:15px;margin-bottom:14px}
  .loginRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;width:220px}
  input.code{width:220px;letter-spacing:1px;font-family:ui-monospace,consolas,monospace}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;color:var(--accent);font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#07121f;font-weight:700}
  button.good{background:var(--accent2);border-color:var(--accent2);color:#06281a;font-weight:700}
  button.danger{background:var(--red);border-color:var(--red);color:#2a0505;font-weight:700}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .ok{color:var(--accent2);font-size:13px;margin-top:8px}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .filters button.active{background:var(--accent);border-color:var(--accent);color:#07121f}

  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  td code{font-family:ui-monospace,consolas,monospace;letter-spacing:1px;color:var(--gold)}
  tr:hover{background:rgba(255,255,255,.03)}
  .badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge.playing{background:rgba(52,211,153,.15);color:var(--accent2)}
  .badge.prize{background:rgba(248,113,113,.15);color:var(--red)}
  .badge.online{background:rgba(91,140,255,.18);color:#8ab4ff}
  .muted{color:var(--muted);font-size:12px;white-space:nowrap}
  .right{text-align:right}
  .actionBtns{display:flex;gap:6px;justify-content:flex-end}
  .actionBtns button{padding:6px 10px;font-size:12px}
  button.mini{padding:6px 10px;font-size:12px;margin:0}
  .boostCell,input.tapsCell{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .statCards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .statCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;flex:1;min-width:130px}
  .statCard .n{font-size:24px;font-weight:700}
  .statCard .k{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .statCard.green .n{color:var(--accent2)}
  .statCard.red .n{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 Панель управления кодами</h1>
  <div class="sub">Просмотр кодов, чёрный список («получил приз»), нейтральные (играющие) и онлайн-статус</div>

  <!-- Панель -->
  <div id="adminPanel">
    <div class="statCards">
      <div class="statCard"><div class="k">Всего игроков</div><div class="n" id="statTotal">0</div></div>
      <div class="statCard green"><div class="k">Играют</div><div class="n" id="statPlaying">0</div></div>
      <div class="statCard red"><div class="k">Чёрный список</div><div class="n" id="statPrize">0</div></div>
    </div>

    <div class="panel">
      <h2>Поиск кода</h2>
      <div class="loginRow">
        <input id="searchCode" class="code" type="text" placeholder="Введи 18-значный код">
        <button class="primary" id="loadBtn">Найти</button>
      </div>
      <div id="searchResult"></div>
    </div>

    <div class="panel">
      <h2>Список кодов</h2>
      <div class="filters">
        <button class="active" data-f="all">Все</button>
        <button data-f="playing">Играющие</button>
        <button data-f="prize">Чёрный список</button>
      </div>
      <div id="tableWrap"></div>
    </div>
  </div>
</div>

<script>
const API='/admin';
// токен из URL (?token=...) или сохранённый ранее
let token = new URLSearchParams(location.search).get('token') || localStorage.getItem('admin_token') || '';
if (token) { localStorage.setItem('admin_token', token); history.replaceState({}, '', location.pathname); }
let filter='all';
let codes=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function req(path,opts={}){
  const url=API+path;
  const res=await fetch(url,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},...opts});
  if(res.status===401){ showLogin(); return {status:401,data:{}}; }
  return {status:res.status,data:await res.json().catch(()=>({}))};
}

function showLogin() { location.href='/admin.html'; }

function toLocale(v){return Number(v).toLocaleString('ru-RU')}

async function loadCodes(){
  const {data}=await req('/codes');
  if(data.codes!==undefined) codes=data.codes;
  renderStats();
  renderTable();
}

function renderStats(){
  $('statTotal').textContent=codes.length;
  $('statPlaying').textContent=codes.filter(c=>c.status==='playing').length;
  $('statPrize').textContent=codes.filter(c=>c.status==='prize').length;
}

// формат "когда играл/играет": онлайн или относительное время
function fmtLastSeen(c){
  if(c.online) return '<span class="badge online">● Онлайн</span>';
  if(!c.lastSeen) return '<span class="muted">никогда</span>';
  const ms = Date.now() - new Date(c.lastSeen).getTime();
  const min = Math.floor(ms/60000);
  let txt;
  if(min < 1) txt = 'только что';
  else if(min < 60) txt = min + ' мин назад';
  else { const h = Math.floor(min/60); txt = (h<24) ? h+' ч назад' : Math.floor(h/24)+' дн назад'; }
  return '<span class="muted">'+txt+'</span>';
}

function renderTable(){
  const w=$('tableWrap');
  let list=codes;
  if(filter==='playing') list=codes.filter(c=>c.status==='playing');
  if(filter==='prize') list=codes.filter(c=>c.status==='prize');

  if(list.length===0){
    w.innerHTML='<div class="empty">Нет кодов в этом разделе</div>';
    return;
  }
  let html=`<table>
    <thead><tr>
      <th>Код</th><th>Ник</th><th>Активность</th><th class="right">Баланс</th><th class="right">Тапов</th>
      <th>Буст</th><th>Статус</th><th class="right">Действия</th>
    </tr></thead><tbody>`;
  list.forEach(c=>{
    const badge = c.status==='prize'
      ? '<span class="badge prize">Получил приз (ЧС)</span>'
      : '<span class="badge playing">Играет</span>';
    const actCell = fmtLastSeen(c);
    const boostVal = Number(c.boost) || 1;
    const boostLabel = boostVal % 1 ? 'x' + boostVal : 'x' + Math.round(boostVal);
    const opts = [1,1.5,2,3,5].map(b=>{
      const lab = b % 1 ? 'x'+b : 'x'+Math.round(b);
      return `<option value="${b}" ${b===boostVal?'selected':''}>${lab}</option>`;
    }).join('');
    html+=`<tr>
      <td><code>${esc(c.code)}</code></td>
      <td>${esc(c.nick)}</td>
      <td>${actCell}</td>
      <td class="right">${toLocale(c.balance)}</td>
      <td class="right"><input type="number" class="tapsCell" min="0" value="${esc(c.taps)}" data-code="${esc(c.code)}" style="width:90px;padding:5px 8px"> <button class="mini" data-act="taps" data-code="${esc(c.code)}">OK</button></td>
      <td>
        <select class="boostCell" data-code="${esc(c.code)}" style="padding:5px 8px">${opts}</select>
        <button class="mini" data-act="boost" data-code="${esc(c.code)}">OK</button>
      </td>
      <td>${badge}</td>
      <td>
        <div class="actionBtns">
          <button class="good" data-act="playing" data-code="${esc(c.code)}">Играет</button>
          <button class="danger" data-act="prize" data-code="${esc(c.code)}">ЧС</button>
          <button data-act="del" data-code="${esc(c.code)}">Удалить</button>
        </div>
      </td>
    </tr>`;
  });
  html+='</tbody></table>';
  w.innerHTML=html;
}

async function setStatus(code,status){
  const {data}=await req('/status',{method:'POST',body:JSON.stringify({code,status})});
  if(data.error){alert('Ошибка: '+data.error);return;}
  loadCodes();
}
async function setBoost(code,boost){
  const {data}=await req('/boost',{method:'POST',body:JSON.stringify({code,boost})});
  if(data.error){alert('Ошибка: '+data.error);return;}
  loadCodes();
}
async function setTaps(code,taps){
  const {data}=await req('/taps',{method:'POST',body:JSON.stringify({code,taps})});
  if(data.error){alert('Ошибка: '+data.error);return;}
  loadCodes();
}
async function del(code){
  if(!confirm('Удалить код '+code+'? Это действие необратимо.'))return;
  const {data}=await req('/delete',{method:'POST',body:JSON.stringify({code})});
  if(data.error){alert(data.error);return;}
  loadCodes();
}

// события
// панель открыта без входа — сразу грузим список
loadCodes();
// авто-обновление статуса онлайна каждые 5 секунд
setInterval(()=>{ loadCodes(); }, 5000);

$('loadBtn').onclick=async()=>{
  const c=$('searchCode').value.trim().toUpperCase();
  const r=$('searchResult');
  if(!c){r.innerHTML='';return;}
  const found=codes.find(x=>x.code===c);
  if(!found){r.innerHTML='<div class="err">Код не найден</div>';return;}
  const badge=found.status==='prize'?'<span class="badge prize">Получил приз</span>':'<span class="badge playing">Играет</span>';
  const boostVal = Number(found.boost) || 1;
  const opts = [1,1.5,2,3,5].map(b=>{
    const lab = b % 1 ? 'x'+b : 'x'+Math.round(b);
    return `<option value="${b}" ${b===boostVal?'selected':''}>${lab}</option>`;
  }).join('');
  r.innerHTML=`<div class="ok" style="margin-top:14px;background:var(--panel2);padding:14px;border-radius:10px;max-width:460px">
    <div style="margin-bottom:6px"><b>Ник:</b> ${esc(found.nick)}</div>
    <div style="margin-bottom:6px"><code>${esc(found.code)}</code> ${badge}</div>
    <div style="margin-bottom:6px"><b>Баланс:</b> ${toLocale(found.balance)}</div>
    <div style="margin-bottom:10px"><b>Тапов:</b> ${toLocale(found.taps)}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <label>Буст</label>
      <select class="boostCell" data-code="${esc(found.code)}">${opts}</select>
      <button class="mini" data-act="boost" data-code="${esc(found.code)}">OK</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <label>Тапов</label>
      <input type="number" class="tapsCell" min="0" value="${esc(found.taps)}" data-code="${esc(found.code)}" style="width:90px;padding:5px 8px">
      <button class="mini" data-act="taps" data-code="${esc(found.code)}">OK</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="good" data-act="playing" data-code="${esc(found.code)}">Сделать играющим</button>
      <button class="danger" data-act="prize" data-code="${esc(found.code)}">В чёрный список</button>
      <button data-act="del" data-code="${esc(found.code)}">Удалить</button>
    </div>
  </div>`;
};

// делегирование кликов по таблице и результату поиска
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const act=btn.dataset.act, code=btn.dataset.code;
  if(act==='playing')setStatus(code,'playing');
  if(act==='prize')setStatus(code,'prize');
  if(act==='del')del(code);
  if(act==='boost'){
    // берём селект в этой же строке
    const sel=btn.parentElement.querySelector('.boostCell');
    setBoost(code, Number(sel.value));
  }
  if(act==='taps'){
    const inp=btn.parentElement.querySelector('.tapsCell');
    setTaps(code, Number(inp.value));
  }
  $('searchResult').innerHTML='';
});

document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    filter=b.dataset.f;
    renderTable();
  };
});
</script>
</body>
</html>
